name: CG-MedSAM CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install git+https://github.com/facebookresearch/segment-anything.git
          pip install fastapi uvicorn python-multipart

      - name: Run Test Suite
        run: |
          python -m unittest discover tests -v

      - name: Verify Checkpoint Checksum Manifest
        run: |
          python scripts/verify_checkpoints.py || true

      - name: Verify Table Compilation Scripts
        run: |
          python src/eval/compile_comparative_table.py
          python src/eval/compile_table2_fairness.py
          python src/eval/compile_table3_ablation.py
          python src/eval/compute_statistical_tests.py
          python src/eval/cross_domain_benchmark.py
